# jocal config: every budget knob for local sessions. Shell-sourced; written once on first run, never overwritten.
# Keys missing here fall back to the defaults in the repo's jocal.conf.

# models: key=oMLX id (folder under MODELS_DIR). The first is the default; `--<key>` picks another for one session.
# Keys name the model, not the slot, and contain a digit (4b, 9b), so `--<key>` can't be taken for a harness flag.
MODELS="4b=Qwen3.5-4B-MLX-4bit 9b=Qwen3.5-9B-MLX-4bit"
# pins: `jocal fetch` downloads these commits; `jocal status` flags drift. Models are key=<hf repo>@<commit>.
PIN_MODELS="4b=mlx-community/Qwen3.5-4B-MLX-4bit@32f3e8ecf65426fc3306969496342d504bfa13f3 9b=mlx-community/Qwen3.5-9B-MLX-4bit@938d8919941c6e7efd3c7150eff7fe9d12afa631"
PIN_OMLX=0.7.0  PIN_PI=1.3.0  PIN_CLAUDE=2.1.302
CANDIDATE=""                     # "<new key>:<key it may replace>" while trying a model: allows MAX_MODELS + 1
MODELS_DIR=~/models/mlx

# budget
RAM_GB=10  DISK_CAP_GB=20  MAX_MODELS=2
CTX=32768  MAX_OUT=4096  PROMPT_CACHE_GB=4  PORT=8000

# runtime
STOP_RUNTIME=last-exit           # or manual

# allowlist: empty = the 4 core tools and no MCP. Each addition costs prompt tokens on every turn.
PI_EXTRA_TOOLS=""  CLAUDE_EXTRA_TOOLS=""   # comma-separated, as --tools takes them
# MCP_SERVERS: space-separated names from MCP_FILE (Claude Code's mcpServers format); stdio or a localhost URL only.
MCP_FILE=~/.config/jocal/mcp.json  MCP_SERVERS=""
# WEB_SEARCH: "" (off) or duckduckgo, which gives Pi a web_search tool. Its queries leave this Mac; nothing else does.
# The env beats this for one session: WEB_SEARCH=duckduckgo jocal pi.
WEB_SEARCH=""

# instructions
LOCAL_INSTRUCTIONS=~/.config/jocal/LOCAL.md  LOCAL_INSTRUCTIONS_MAX_TOKENS=300
